name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you are running, from `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 140 on macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server output, browser console errors, or screenshots, if you have any.
