# Runs the app with PostgreSQL and Keycloak: `docker compose up --build`.
# For development, start only the services the app needs with
# `docker compose up -d db keycloak` and run `topcoat dev` on the host.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: projects
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projects}
      POSTGRES_DB: projects
    ports:
      # Published on this machine only, for `topcoat dev` and `psql`.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projects -d projects"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Signs users in. The admin console is at http://localhost:8080 (admin / admin).
  # This runs Keycloak in development mode with a demo realm; do not expose it.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Browsers reach Keycloak here, and tokens name this URL as their issuer.
      KC_HOSTNAME: http://localhost:8080
      # Lets the app container reach Keycloak as http://keycloak:8080.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      # Imported on the first start only. Later changes to this file need
      # `docker compose down --volumes`.
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      # The image has no curl, so ask the health endpoint through Bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://projects:${POSTGRES_PASSWORD:-projects}@db:5432/projects
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    ports:
      # The Keycloak client only allows sign-in from port 3000.
      - "3000:3000"

volumes:
  db-data:
  keycloak-data:
